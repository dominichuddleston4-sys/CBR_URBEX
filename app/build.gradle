plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'au.com.canberraexplorer.app'
    compileSdk 35

    defaultConfig {
        applicationId 'au.com.canberraexplorer.app'
        minSdk 23
        targetSdk 35
        versionCode = (project.findProperty('appVersionCode') ?: '2').toString().toInteger()
        versionName = (project.findProperty('appVersionName') ?: '0.2.0').toString()
    }

    signingConfigs {
        release {
            storeFile = file(System.getenv('ANDROID_KEYSTORE_PATH') ?: 'missing-keystore.jks')
            storePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
            keyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: ''
            keyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
        }
    }
}


dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'org.maplibre.gl:android-sdk:13.5.4'
}
