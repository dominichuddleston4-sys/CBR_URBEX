plugins {
    id 'com.android.application'
}

android {
    namespace 'au.com.canberraexplorer.app'
    compileSdk 35

    defaultConfig {
        applicationId 'au.com.canberraexplorer.app'
        minSdk 23
        targetSdk 35
        versionCode (System.getenv('APP_VERSION_CODE') ?: '2').toInteger()
        versionName System.getenv('APP_VERSION_NAME') ?: '0.2.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: 'missing-keystore.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: ''
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
