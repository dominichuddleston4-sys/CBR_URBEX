name: Native map prototype build test

on:
  push:
    branches:
      - feature/native-map-renderer-spike
    paths:
      - 'app/**'
      - '.github/workflows/native-map-prototype-test.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # A placeholder Firebase config lets the Android resources compile.
      # This workflow does not test real Google sign-in or contact Firebase.
      - name: Create temporary compile-only Google services config
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "canberra-explorer-ci",
              "storage_bucket": "canberra-explorer-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "au.com.canberraexplorer.app"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-placeholder.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "ci-placeholder-not-a-real-key"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Run Android unit tests and compile debug APK
        run: |
          gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK for review
        uses: actions/upload-artifact@v4
        with:
          name: canberra-explorer-native-map-prototype-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
