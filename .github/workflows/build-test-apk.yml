name: Build and publish Canberra Explorer APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/2.0-completion, feature/2.0.5-photo-galleries, feature/iphone-matched-android-ui, release/2-0-half-iphone-menu, feature/offline-improvements-test]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'firestore.rules'
      - 'places.json'
      - 'icon.svg'
      - '.github/workflows/build-test-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'places.json'
      - 'icon.svg'
      - '.github/workflows/build-test-apk.yml'

concurrency:
  group: canberra-explorer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/canberra-explorer-release.jks"
          test -s "$RUNNER_TEMP/canberra-explorer-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/canberra-explorer-release.jks" >> "$GITHUB_ENV"

      - name: Build bundled Canberra offline routing data
        run: |
          set -euo pipefail
          mkdir -p .offline-routing app/src/main/assets
          curl --fail --location --retry 3 --retry-delay 2 \
            https://download.bbbike.org/osm/bbbike/Canberra/Canberra.osm.pbf \
            --output .offline-routing/Canberra.osm.pbf
          docker pull ghcr.io/valhalla/valhalla-scripted:3.9.1
          docker run --rm --entrypoint /bin/sh \
            -v "$PWD/.offline-routing:/data" \
            ghcr.io/valhalla/valhalla-scripted:3.9.1 -c '
              set -e
              mkdir -p /data/tiles
              valhalla_build_config \
                --mjolnir-tile-dir /data/tiles \
                --mjolnir-tile-extract /data/valhalla_tiles.tar \
                --mjolnir-timezone /data/tz_world.sqlite \
                --mjolnir-admin /data/admin.sqlite > /data/valhalla.json
              valhalla_build_timezones > /data/tz_world.sqlite
              valhalla_build_admins -c /data/valhalla.json /data/Canberra.osm.pbf
              valhalla_build_tiles -c /data/valhalla.json /data/Canberra.osm.pbf
              valhalla_build_extract -c /data/valhalla.json -v
              valhalla_service /data/valhalla.json 1 >/data/valhalla-service.log 2>&1 &
              service_pid=$!
              trap "kill $service_pid 2>/dev/null || true" EXIT
              python3 - <<'PY'
              import json, time, urllib.request
              for attempt in range(60):
                  try:
                      urllib.request.urlopen("http://127.0.0.1:8002/status", timeout=2).read()
                      break
                  except Exception:
                      if attempt == 59:
                          raise RuntimeError("Valhalla service did not start; see valhalla-service.log")
                      time.sleep(1)
              for costing in ("auto", "pedestrian"):
                  payload = {
                      "locations": [
                          {"lat": -35.28, "lon": 149.13, "type": "break"},
                          {"lat": -35.30, "lon": 149.14, "type": "break"}
                      ],
                      "costing": costing,
                      "units": "kilometers",
                      "directions_options": {"units": "kilometers"}
                  }
                  request = urllib.request.Request(
                      "http://127.0.0.1:8002/route",
                      data=json.dumps(payload).encode(),
                      headers={"Content-Type": "application/json"}
                  )
                  result = json.loads(urllib.request.urlopen(request, timeout=30).read())
                  if not result.get("trip", {}).get("legs", [{}])[0].get("shape"):
                      raise RuntimeError("No " + costing + " road route returned: " + json.dumps(result)[:1000])
                  print(costing + " offline route smoke test passed")
              PY
            '
          test -s .offline-routing/valhalla_tiles.tar
          test -s .offline-routing/admin.sqlite
          test -s .offline-routing/tz_world.sqlite
          cp .offline-routing/valhalla_tiles.tar app/src/main/assets/
          cp .offline-routing/admin.sqlite app/src/main/assets/
          cp .offline-routing/tz_world.sqlite app/src/main/assets/
          du -h app/src/main/assets/valhalla_tiles.tar app/src/main/assets/admin.sqlite app/src/main/assets/tz_world.sqlite

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ github.ref == 'refs/heads/main' && '2.0½' || (github.ref == 'refs/heads/feature/2.0.5-photo-galleries' && '2.0½-test' || (github.ref == 'refs/heads/release/2-0-half-iphone-menu' && '2.0½-release-test' || (github.ref == 'refs/heads/feature/iphone-matched-android-ui' && '2.0½-iphone-test' || format('1.{0}', github.run_number)))) }}
          APP_WEB_URL: ${{ github.ref == 'refs/heads/feature/2.0.5-photo-galleries' && 'https://deploy-preview-7--cbrurbex.netlify.app/' || (github.ref == 'refs/heads/feature/iphone-matched-android-ui' && 'https://deploy-preview-10--cbrurbex.netlify.app/' || (github.ref == 'refs/heads/release/2-0-half-iphone-menu' && 'https://deploy-preview-11--cbrurbex.netlify.app/' || (github.ref == 'refs/heads/feature/offline-improvements-test' && 'https://deploy-preview-14--cbrurbex.netlify.app/' || 'https://dominichuddleston4-sys.github.io/CBR_URBEX/'))) }}
        run: |
          gradle --no-daemon --stacktrace --info -PappVersionCode="$APP_VERSION_CODE" -PappVersionName="$APP_VERSION_NAME" -PappWebUrl="$APP_WEB_URL" assembleRelease
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/app-release.apk
          echo "VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"

      - name: Upload test APK artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: canberra-explorer-test-apk
          path: release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as the latest GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Canberra Explorer ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: release/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Publish update information to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        with:
          script: |
            const path = 'version.json';
            const content = JSON.stringify({
              versionCode: Number(process.env.VERSION_CODE),
              versionName: process.env.VERSION_NAME,
              apkUrl: 'https://github.com/dominichuddleston4-sys/CBR_URBEX/releases/latest/download/app-release.apk'
            }, null, 2) + '\n';
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Publish Canberra Explorer APK update information',
              content: Buffer.from(content).toString('base64'),
              ...(sha ? { sha } : {}),
              branch: 'main'
            });

      - name: Report build result on commit
        if: always()
        uses: actions/github-script@v7
        env:
          BUILD_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.BUILD_STATUS === 'success'
              ? 'success'
              : process.env.BUILD_STATUS === 'failure' ? 'failure' : 'error';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'canberra-explorer/build',
              description: 'Signed APK build ' + state,
              target_url: 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
